<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Oranee Kasem - Full Stack Developer</title>
    <meta
      name="description"
      content="Oranee is a full stack developer with cloud engineering knowledge based in Wellington, New Zealand. React, TypeScript, Node.js and AWS — with a background in hospitality leadership."
    />
    <meta name="author" content="Oranee" />
    <meta
      name="theme-color"
      content="#111111"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#F7F6F2"
      media="(prefers-color-scheme: light)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oranee — Full Stack Developer" />
    <meta
      property="og:description"
      content="Full stack developer with cloud engineering knowledge, based in Wellington, New Zealand."
    />
    <meta property="og:locale" content="en_NZ" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Oranee — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Full stack developer with cloud engineering knowledge, based in Wellington, New Zealand."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applies the saved theme before first paint so the page never flashes.
      ;(function () {
        try {
          var stored = localStorage.getItem('orannee-portfolio-theme')
          var prefersLight = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches
          var dark = stored ? stored === 'dark' : !prefersLight
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Oranee",
        "jobTitle": "Full Stack Developer",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Wellington",
          "addressCountry": "NZ"
        },
        "knowsAbout": [
          "React",
          "TypeScript",
          "Node.js",
          "PostgreSQL",
          "AWS",
          "Microsoft Azure"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
